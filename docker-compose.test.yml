services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: test
    volumes:
      - ./api/migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.up.sql:ro
      - ./api/migrations/002_articles.up.sql:/docker-entrypoint-initdb.d/002_articles.up.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test-net]

  api-test:
    build:
      context: ./api
      dockerfile: Dockerfile.test
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://app:app@test-db:5432/test?sslmode=disable
    networks: [test-net]

networks:
  test-net:
    driver: bridge
