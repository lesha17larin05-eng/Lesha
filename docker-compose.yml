services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_DIR:-./data}/pgdata:/var/lib/postgresql/data
      # Бэкапы делает хостовый cron через `docker compose exec postgres pg_dump`,
      # см. /root/bin/pg-backup.sh. Отдельный volume для них не нужен.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  migrate:
    image: migrate/migrate:v4.17.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    networks:
      - internal
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      APP_HOST: ${APP_HOST}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      PRODAMUS_PAYFORM_URL: ${PRODAMUS_PAYFORM_URL}
      PRODAMUS_SECRET_KEY: ${PRODAMUS_SECRET_KEY}
      PRODAMUS_TEST_MODE: ${PRODAMUS_TEST_MODE}
      VIDEO_TOKEN_SECRET: ${VIDEO_TOKEN_SECRET}
      VIDEO_TOKEN_TTL: ${VIDEO_TOKEN_TTL}
      VIDEO_STORAGE_PATH: ${VIDEO_STORAGE_PATH}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      USER_EMAIL: ${USER_EMAIL}
      USER_PASSWORD: ${USER_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      - ${DATA_DIR:-./data}/videos:/var/videos
      - ${DATA_DIR:-./data}/uploads:/var/uploads
    networks:
      - internal

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      API_URL_INTERNAL: http://api:8080
      PUBLIC_API_URL: /api
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DATA_DIR:-./data}/videos:/var/videos:ro
      # Сертификаты Let's Encrypt с хоста (read-only)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot для ACME-челленджей (certbot пишет сюда, nginx раздаёт)
      - ${DATA_DIR:-./data}/certbot/www:/var/www/certbot:ro
    networks:
      - internal

networks:
  internal:
    driver: bridge
