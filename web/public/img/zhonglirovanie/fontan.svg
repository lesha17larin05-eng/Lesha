<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 20 440 370" role="img" aria-label="Схема жонглирования тремя мячами: каждый мяч вылетает из центральной точки и по дуге летит в другую руку">
  <defs>
    <radialGradient id="bo" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#f59a63"/><stop offset="1" stop-color="#e8652a"/></radialGradient>
    <radialGradient id="bn" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#3c4f86"/><stop offset="1" stop-color="#1a2744"/></radialGradient>
    <radialGradient id="bb" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#8fbef5"/><stop offset="1" stop-color="#4a8fe0"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e8652a" stop-opacity=".35"/><stop offset="1" stop-color="#e8652a" stop-opacity="0"/></radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a2744" fill-opacity=".45"/>
    </marker>
  </defs>
  <!-- траектории: обе вылетают из одной центральной точки -->
  <path d="M300 318 C 282 30, 178 30, 160 300" fill="none" stroke="#1a2744" stroke-opacity=".35" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ar)"/>
  <path d="M300 318 C 318 30, 422 30, 440 300" fill="none" stroke="#1a2744" stroke-opacity=".35" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ar)"/>
  <!-- центральная точка -->
  <circle cx="300" cy="318" r="34" fill="url(#glow)"/>
  <circle cx="300" cy="318" r="15" fill="none" stroke="#e8652a" stroke-width="2.5" stroke-opacity=".55"/>
  <circle cx="300" cy="318" r="7" fill="#e8652a"/>
  <!-- ладони -->
  <path d="M110 338 q 50 42 105 0" fill="none" stroke="#1a2744" stroke-width="9" stroke-linecap="round"/>
  <path d="M385 338 q 50 42 105 0" fill="none" stroke="#1a2744" stroke-width="9" stroke-linecap="round"/>
  <!-- мячи: 1 летит вправо, 2 – влево, 3 только что вылетел вправо -->
  <g font-family="Manrope, system-ui, sans-serif" font-weight="800" font-size="24" fill="#fff" text-anchor="middle" dominant-baseline="central">
    <circle cx="416" cy="158" r="28" fill="url(#bo)"/><text x="416" y="159">1</text>
    <circle cx="232" cy="98" r="28" fill="url(#bn)"/><text x="232" y="99">2</text>
    <circle cx="318" cy="190" r="28" fill="url(#bb)"/><text x="318" y="191">3</text>
  </g>
</svg>
