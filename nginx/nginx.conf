user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 5G;
    server_tokens off;

    upstream api  { server api:8080; }
    upstream web  { server web:4321; }

    # ─── Content-Security-Policy ─────────────────────────────────────────
    # Один источник правды: список доменов, с которых грузится контент сайта.
    # Менять CSP — здесь. Если ломаются ресурсы — добавь домен в нужную директиву.
    # mc.yandex.ru / mc.webvisor.org — Яндекс.Метрика (скрипт, хиты, вебвизор).
    # Google Fonts убраны: шрифты self-hosted в /fonts/.
    map $sent_http_content_type $csp_value {
        default "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.webvisor.org; media-src 'self' blob:; connect-src 'self' https://mc.yandex.ru https://mc.webvisor.org; frame-src https://mc.yandex.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.payform.ru";
    }

    # ─── HTTP (port 80) ──────────────────────────────────────────────────
    # На проде делает две вещи:
    #   1) Отдаёт ACME-челленджи Let's Encrypt из /var/www/certbot.
    #   2) Всё остальное редиректит на HTTPS.
    # На dev (когда серта ещё нет) — этот блок продолжит работать как обычный
    # HTTP-сайт, потому что certbot не зашёл, см. ssl_*_required ниже.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ACME challenge (Let's Encrypt webroot). Должен оставаться доступен по HTTP.
        # Важно: этот location ДОЛЖЕН быть до `location /` с редиректом, и сам
        # редирект — внутри `location /`, а НЕ на уровне server (иначе nginx
        # сделает 301 ещё до matching location'ов и certbot получит 403).
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        # Всё остальное — на HTTPS.
        location / {
            return 301 https://leshalarin.ru$request_uri;
        }

        # ─── BOOTSTRAP HTTP (используется только до первого `make tls-init`) ──
        # add_header X-Content-Type-Options "nosniff" always;
        # add_header X-Frame-Options "DENY" always;
        # add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # add_header Content-Security-Policy $csp_value always;
        #
        # location = /api/webhooks/prodamus { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
        # location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_request_buffering off; proxy_read_timeout 300s; }
        # location /video-stream/ { rewrite ^/video-stream/.*$ /api/internal/video-auth break; proxy_pass http://api; proxy_set_header X-Original-URI $request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_pass_request_body off; proxy_set_header Content-Length ""; }
        # location /protected-videos/ { internal; alias /var/videos/; add_header Cache-Control "no-store" always; types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; } }
        # location / { proxy_pass http://web; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    }

    # ─── HTTPS (port 443) ────────────────────────────────────────────────
    # Сертификат выпускается через `make tls-init` (webroot — nginx не стопаем).
    # Автообновление — cron на хосте (см. docs/07-deploy-ops.md).
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name leshalarin.ru www.leshalarin.ru;

        ssl_certificate     /etc/letsencrypt/live/leshalarin.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/leshalarin.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy $csp_value always;

        # www → apex
        if ($host = www.leshalarin.ru) {
            return 301 https://leshalarin.ru$request_uri;
        }

        # Prodamus webhook
        location = /api/webhooks/prodamus {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API
        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }

        # MP4-видео бесплатного курса «Мягкий старт» (публичные).
        # Файлы на хосте: /root/data/videos/myagkiy-start/*.mp4
        # Тот же volume /var/videos монтирован в nginx-контейнер.
        location /lesson-videos/ {
            alias /var/videos/;
            add_header Cache-Control "public, max-age=86400" always;
            add_header Accept-Ranges bytes always;
            expires 1d;
        }

        # Платные курсы — проверяем enrollment перед отдачей файла.
        # auth_request бросает запрос в /_lesson_mp4_auth (internal), который
        # форвардит в Go с X-Original-URI и cookies. Go отвечает 200/401/403;
        # любые другие коды nginx считает сбоем и возвращает 500.
        # Клиент кэширует на 24 часа (как для бесплатных).
        location /lesson-videos/zdorovaya-spina/ {
            auth_request /_lesson_mp4_auth;
            alias /var/videos/zdorovaya-spina/;
            add_header Cache-Control "private, max-age=86400" always;
            add_header Accept-Ranges bytes always;
            expires off;
        }

        # Internal subrequest target для auth_request выше.
        # Передаём оригинальный URI и пробрасываем Cookie, чтобы Go middleware
        # Auth увидел access_token.
        location = /_lesson_mp4_auth {
            internal;
            proxy_pass http://api/api/internal/lesson-mp4-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        # Protected video streaming — Go validates JWT and returns X-Accel-Redirect
        location /video-stream/ {
            rewrite ^/video-stream/.*$ /api/internal/video-auth break;
            proxy_pass http://api;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location /protected-videos/ {
            internal;
            alias /var/videos/;
            add_header Cache-Control "no-store" always;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        # Astro frontend
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
