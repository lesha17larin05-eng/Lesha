user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 5G;
    server_tokens off;

    upstream api  { server api:8080; }
    upstream web  { server web:4321; }

    # ─── Content-Security-Policy ─────────────────────────────────────────
    # Один источник правды: список доменов, с которых грузится контент сайта.
    # Менять CSP — здесь. Если ломаются ресурсы — добавь домен в нужную директиву.
    map $sent_http_content_type $csp_value {
        default "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.payform.ru";
    }

    # ─── HTTP (port 80) ──────────────────────────────────────────────────
    # Пока нет TLS — этот server обслуживает весь трафик.
    # Как только включишь HTTPS — раскомментируй ниже `return 301 ...`
    # и закомментируй все location-блоки внутри этого `server {}`.
    server {
        listen 80;
        server_name _;

        # === ВКЛЮЧИ НА ПРОДЕ ПОСЛЕ ПОЛУЧЕНИЯ СЕРТИФИКАТА ===
        # return 301 https://$host$request_uri;
        # =====================================================

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy $csp_value always;

        # Prodamus webhook
        location = /api/webhooks/prodamus {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API
        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }

        # Protected video streaming — Go validates JWT and returns X-Accel-Redirect
        location /video-stream/ {
            rewrite ^/video-stream/.*$ /api/internal/video-auth break;
            proxy_pass http://api;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location /protected-videos/ {
            internal;
            alias /var/videos/;
            add_header Cache-Control "no-store" always;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        # Astro frontend
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── HTTPS (port 443) ────────────────────────────────────────────────
    # ВКЛЮЧИТЬ ПОСЛЕ ВЫПУСКА СЕРТИФИКАТА (см. docs/07-deploy-ops.md, секция HTTPS).
    #
    # Шаги:
    #   1. Купить домен (например leshalarin.ru), направить A-запись на IP сервера.
    #   2. На сервере: `apt install certbot` и однократно
    #      `certbot certonly --standalone -d leshalarin.ru -d www.leshalarin.ru`
    #      (или certbot-плагином nginx — но тогда нужно временно остановить контейнер).
    #   3. Подмонтировать `/etc/letsencrypt/` в nginx-контейнер (volume в docker-compose.yml).
    #   4. Раскомментировать блок ниже + редирект в server {listen 80;} выше.
    #   5. Перезапустить nginx: `docker compose restart nginx`.
    #   6. Автообновление серта: cron на хосте — `0 3 * * * certbot renew --quiet && docker compose exec nginx nginx -s reload`.
